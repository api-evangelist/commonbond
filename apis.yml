aid: commonbond
name: CommonBond
description: >-
  CommonBond was a New York City based financial technology lender founded in 2011 by David Klein,
  Michael Taormina and Jessup Shean that refinanced student loans for university graduates and
  originated in-school loans for MBA, law, medical and engineering students, later adding Parent PLUS
  refinancing and a solar/green home-improvement lending product. It raised institutional debt and
  equity financing, including a $35M Series B in 2015 and a $150M lending partnership with Nelnet,
  and operated a consumer lending platform at commonbond.co with an externally documented Postman
  based API at api-docs.commonbond.co. The company exited student loan refinancing in 2022 after the
  federal payment and interest pause removed much of the refinance market, pivoted to solar lending,
  and subsequently wound down. As of this profile the commonbond.co domain is parked and every path
  on it, including the former API documentation host, returns HTTP 410 Gone, so no public API surface
  remains to profile.
